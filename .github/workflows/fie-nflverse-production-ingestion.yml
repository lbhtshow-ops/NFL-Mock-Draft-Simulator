name: FIE NFLVerse Production Ingestion

on:
  workflow_dispatch:
    inputs:
      season:
        description: "NFL season"
        required: true
        type: string
      week:
        description: "NFL week"
        required: true
        type: string
      game_type:
        description: "Game type"
        required: true
        type: choice
        options:
          - REG
          - POST
      teams:
        description: "Comma-separated team abbreviations"
        required: true
        type: string
      mode:
        description: "Execution mode"
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - database-preflight
          - execute-write
      network_acknowledgment:
        description: "Enter YES to authorize NFLVerse network acquisition"
        required: true
        type: string
      write_acknowledgment:
        description: "Enter AUTHORIZE_WRITE for production database writes"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fie-nflverse-production-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    environment: fie-research-production
    timeout-minutes: 30

    env:
      SEASON: ${{ inputs.season }}
      WEEK: ${{ inputs.week }}
      GAME_TYPE: ${{ inputs.game_type }}
      TEAMS: ${{ inputs.teams }}
      MODE: ${{ inputs.mode }}
      NETWORK_ACK: ${{ inputs.network_acknowledgment }}
      WRITE_ACK: ${{ inputs.write_acknowledgment }}

    steps:
      - name: Validate authorization and scope
        shell: bash
        run: |
          set -euo pipefail

          [[ "$NETWORK_ACK" == "YES" ]] || exit 1
          [[ "$SEASON" =~ ^20[0-9]{2}$ ]] || exit 1
          [[ "$WEEK" =~ ^([1-9]|1[0-8])$ ]] || exit 1
          [[ "$TEAMS" =~ ^[A-Z]{2,3}(,[A-Z]{2,3})*$ ]] || exit 1

          if [[ "$MODE" == "execute-write" ]]; then
            [[ "$WRITE_ACK" == "AUTHORIZE_WRITE" ]] || exit 1
          fi

      - name: Checkout approved source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify MDS Runtime database identity
        if: ${{ inputs.mode == 'database-preflight' || inputs.mode == 'execute-write' }}
        working-directory: frontend
        env:
          RESEARCH_REPOSITORY_DATABASE_URL: ${{ secrets.RESEARCH_REPOSITORY_DATABASE_URL }}
          EXPECTED_SUPABASE_PROJECT_REF: ahmorpzcaapvovmiqlkv
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import pg from 'pg';

          const uri = process.env.RESEARCH_REPOSITORY_DATABASE_URL;
          const expected = process.env.EXPECTED_SUPABASE_PROJECT_REF;

          if (!uri) throw new Error('DATABASE_SECRET_MISSING');

          const parsed = new URL(uri);
          const host = parsed.hostname.toLowerCase();
          const user = decodeURIComponent(parsed.username);

          const direct = host === `db.${expected}.supabase.co`;
          const pooler =
            host.endsWith('.pooler.supabase.com') &&
            user.endsWith(`.${expected}`);

          if (!direct && !pooler) {
            throw new Error('DATABASE_PROJECT_IDENTITY_MISMATCH');
          }

          const pool = new pg.Pool({
            connectionString: uri,
            ssl: { rejectUnauthorized: false },
            max: 1,
            connectionTimeoutMillis: 15000
          });

          try {
            const client = await pool.connect();
            try {
              await client.query('BEGIN READ ONLY');
              const result = await client.query(`
                SELECT
                  current_database() AS database_name,
                  to_regclass('public.research_sources') AS research_sources,
                  to_regclass('public.research_sessions') AS research_sessions,
                  to_regclass('public.recorded_observations') AS recorded_observations,
                  to_regclass('public.evidence_artifacts') AS evidence_artifacts
              `);

              const row = result.rows[0];
              const required = [
                'research_sources',
                'research_sessions',
                'recorded_observations',
                'evidence_artifacts'
              ];

              for (const table of required) {
                if (!row[table]) {
                  throw new Error(`REQUIRED_TABLE_MISSING:${table}`);
                }
              }

              console.log('SUPABASE_PROJECT_IDENTITY=PASS');
              console.log('RESEARCH_REPOSITORY_SCHEMA=PASS');
              console.log('DATABASE_CONNECTION=PASS');
              console.log('DATABASE_WRITES=NONE');
              await client.query('ROLLBACK');
            } finally {
              client.release();
            }
          } finally {
            await pool.end();
          }
          NODE
      - name: Run governed NFLVerse ingestion
        if: ${{ inputs.mode != 'database-preflight' }}
        working-directory: frontend
        env:
          RESEARCH_REPOSITORY_DATABASE_URL: ${{ secrets.RESEARCH_REPOSITORY_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail

          ARGS=(
            --season "$SEASON"
            --week "$WEEK"
            --game-type "$GAME_TYPE"
            --teams "$TEAMS"
          )

          if [[ "$MODE" == "execute-write" ]]; then
            [[ -n "${RESEARCH_REPOSITORY_DATABASE_URL:-}" ]] || exit 1
            ARGS+=(--execute-write)
          else
            ARGS+=(--dry-run)
          fi

          node scripts/runGovernedNFLVerseCurrentMultiSignalAvailability.mjs "${ARGS[@]}"